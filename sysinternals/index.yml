additionalContent:
  sections:
    - title: Sysinternals Live usage
      summary: "In Windows Explorer use live.sysinternals.com/<toolname> or \\\\live.sysinternals.com\\tools\\<toolname>. In a command prompt use \\\\live.sysinternals.com\\tools\\<toolname>."

    - title: What's new
      summary: "Latest utility updates. RSS feed: https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=Sysinternals-Blog"
      items:
        - title: July 24, 2026
          links:
            - url: downloads/zoomit.md
              text: "ZoomIt for Mac v12.21: Adds macOS availability with zooming, annotation, screenshot, recording, video clip editing, panoramic capture, and break timer features."

        - title: June 17, 2026
          links:
            - url: downloads/autoruns.md
              text: "Autoruns v14.3: Adds bug fixes and aligns autorunsc command-line capabilities with the GUI, including packaged apps support."
            - url: downloads/zoomit.md
              text: "ZoomIt v12.1: Adds image backgrounds, webcam background blur, and microphone noise cancellation support."

        - title: May 7, 2026
          links:
            - url: downloads/autoruns.md
              text: "Autoruns v14.2: Adds support for Windows packaged apps."
            - url: downloads/procdump.md
              text: "ProcDump v12.0: Adds process tree support with -pt."
            - url: downloads/zoomit.md
              text: "ZoomIt v12.0: Adds webcam overlay for video captures and clip append support in the video trim editor."

        - title: March 26, 2026
          links:
            - url: https://github.com/microsoft/Sysinternals-listent/releases/tag/1.0.0
              text: "listent 1.0 for macOS: Command-line tool to discover and list code signing entitlements with static scanning, real-time process monitoring, and daemon mode."
            - url: downloads/zoomit.md
              text: "ZoomIt v11.0: Adds panorama and scrolling screenshots, text extraction during snip, break timer improvements, and .mp4 clip editor support."
            - url: downloads/sysmon.md
              text: "Sysmon v15.2: Improves internal events queue handling for better resilience under high system load."
            - url: downloads/debugview.md
              text: "DebugView v5.0: Improves Windows 11 support, adds a modern dark-theme UI, and includes performance optimizations."
            - url: downloads/notmyfault.md
              text: "NotMyFault v4.40: Adds secure kernel and hypervisor crash triggers."
